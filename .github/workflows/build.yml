name: Build Clutcher Port

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate source
        run: python3 tools/validate_source.py

      - name: Setup Theos
        uses: Randomblock1/theos-action@v1

      - name: Build DEB
        shell: bash
        run: |
          set -euo pipefail
          export THEOS="$GITHUB_WORKSPACE/theos"
          make clean package FINALPACKAGE=1

      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: ClutcherPort-DEB
          path: packages/*.deb
          if-no-files-found: error
