      - name: Setup Theos
        uses: Randomblock1/theos-action@v1

      - name: Build DEB
        shell: bash
        run: |
          set -euo pipefail
          export THEOS="$GITHUB_WORKSPACE/theos"
          make clean package FINALPACKAGE=1

      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: ClutcherPort-1.0.3-DEB
          path: packages/*.deb
          if-no-files-found: error
